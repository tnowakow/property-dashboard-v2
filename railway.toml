# Property Maintenance Dashboard - Combined Backend + Frontend Deployment
# Uses custom Dockerfile for precise control over Python runtime

[build]
builder = "DOCKER"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

[env]
PYTHON_VERSION = "3.11"
NODE_ENV = "production"
PORT = 8000
