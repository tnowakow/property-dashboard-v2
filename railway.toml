# Property Maintenance Dashboard - Combined Backend + Frontend Deployment
# This service runs both the Python API backend and serves the React frontend

[build]
builder = "NIXPACKS"
plan = "standard"

[[build.commands]]
command = """
  # Install Python dependencies
  pip install -r ../backend/requirements.txt
  
  # Build frontend
  npm ci
  npm run build
"""

[deploy]
startCommand = "uvicorn ../backend/main.py --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

# Runtime settings
[env]
NODE_ENV = "production"
PYTHON_VERSION = "3.11"
PORT = 8000
