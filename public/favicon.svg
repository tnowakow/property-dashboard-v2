<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Boss Face Icon - Favicon -->
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d5b8"/>
      <stop offset="100%" style="stop-color:#e8c4a0"/>
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="50" cy="50" r="45" fill="url(#skin)"/>
  
  <!-- Sunglasses (boss vibes) -->
  <g fill="#1a1a2e">
    <rect x="15" y="38" width="28" height="16" rx="3"/>
    <rect x="57" y="38" width="28" height="16" rx="3"/>
    <line x1="43" y1="46" x2="57" y2="46" stroke="#1a1a2e" stroke-width="2.5"/>
  </g>
  
  <!-- Confident smile -->
  <path d="M 35 68 Q 50 78 65 68" stroke="#c49b6a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Short hair (professional) -->
  <path d="M 10 35 Q 50 -5 90 35 L 85 45 Q 50 10 15 45 Z" fill="#2d2d2d"/>
  
  <!-- Chin/jawline -->
  <path d="M 18 65 Q 50 95 82 65 L 78 55 Q 50 80 22 55 Z" fill="url(#skin)"/>
</svg>
